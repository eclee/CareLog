{% if pagination.pages > 1 %}
<nav class="mt-3" aria-label="分頁">
  <ul class="pagination pagination-sm flex-wrap">
    <li class="page-item {{ 'disabled' if not pagination.has_prev }}">
      <a class="page-link" href="{{ url_for(endpoint, page=pagination.prev_num, **page_args) if pagination.has_prev else '#' }}">上一頁</a>
    </li>
    {% for page_number in pagination.iter_pages(left_edge=1, right_edge=1, left_current=2, right_current=2) %}
      {% if page_number %}
      <li class="page-item {{ 'active' if page_number == pagination.page }}"><a class="page-link" href="{{ url_for(endpoint, page=page_number, **page_args) }}">{{ page_number }}</a></li>
      {% else %}
      <li class="page-item disabled"><span class="page-link">…</span></li>
      {% endif %}
    {% endfor %}
    <li class="page-item {{ 'disabled' if not pagination.has_next }}">
      <a class="page-link" href="{{ url_for(endpoint, page=pagination.next_num, **page_args) if pagination.has_next else '#' }}">下一頁</a>
    </li>
  </ul>
</nav>
{% endif %}
